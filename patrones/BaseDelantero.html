<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Patrón Base Delantero</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .medidas {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ccc;
        width: fit-content;
    }

    .medidas label {
        display: block;
        margin-bottom: 8px;
    }

    .medidas input {
        width: 70px;
        margin-left: 10px;
    }

    button {
        margin-top: 8px;
        margin-right: 8px;
        padding: 6px 15px;
        cursor: pointer;
    }

    svg {
        border: 1px solid #ccc;
        background: white;
    }

    .linea {
        fill: none;
        stroke: black;
        stroke-width: 0.5;
    }

    .curva {
        fill: none;
        stroke: black;
        stroke-width: 0.5;
    }

    .auxiliar {
        fill: none;
        stroke: #999;
        stroke-width: 0.3;
        stroke-dasharray: 2, 2;
    }

    .punto {
        fill: black;
    }

    .texto {
        font-size: 5px;
        fill: black;
    }
</style>
</head>

<body>

<h2>Patrón Base Delantero</h2>

<div class="medidas">

    <label>
        Talle espalda:
        <input type="number" id="talle" value="39" step="0.1">
        cm
    </label>

    <label>
        Contorno pecho:
        <input type="number" id="pecho" value="96" step="0.1">
        cm
    </label>

    <label>
        Ancho espalda:
        <input type="number" id="ancho" value="38" step="0.1">
        cm
    </label>

    <label>
        Hombro:
        <input type="number" id="hombro" value="12" step="0.1">
        cm
    </label>

    <label>
        Sisa:
        <input type="number" id="sisa" value="17" step="0.1">
        cm
    </label>

    <button onclick="dibujarPatron()">
        Generar Patrón
    </button>

    <button onclick="generarPDF1a1('patron', 'Patron_Base_Delantero.pdf')">
        Generar PDF
    </button>

    <button onclick="window.location.href='../index.html'">
        Volver
    </button>

</div>

<svg
    id="patron"
    xmlns="http://www.w3.org/2000/svg">
</svg>


<script>

function dibujarPatron() {

    // ==========================
    // MEDIDAS
    // ==========================

    const talle =
        parseFloat(document.getElementById("talle").value);

    const pecho =
        parseFloat(document.getElementById("pecho").value);

    const ancho =
        parseFloat(document.getElementById("ancho").value);

    const hombro =
        parseFloat(document.getElementById("hombro").value);

    const sisa =
        parseFloat(document.getElementById("sisa").value);


    // ==========================
    // CONSTANTES
    // ==========================

    const bajadaHombro = 5;
    const bajadaCuello = 8;
    const sisaHorizontal = 2;
    const talleHorizontal = 3;
    const bajadaTalle = 5;


    // ==========================
    // CÁLCULOS
    // ==========================

    const cuartoPecho = pecho / 4;
    const medioAncho = ancho / 2;

    const hombroCalculado = hombro - 1;

    const mm = cm => cm * 10;


    // ==========================
    // COORDENADAS REALES
    // ==========================

    const Dp = {
        x: 0,
        y: 0
    };

    const Ap = {
        x: 0,
        y: talle
    };

    const Bp = {
        x: cuartoPecho,
        y: talle
    };

    const Cp = {
        x: cuartoPecho,
        y: 0
    };

    const Ep = {
        x: medioAncho,
        y: talle
    };

    const Fp = {
        x: medioAncho,
        y: 0
    };

    const Hp = {
        x: medioAncho - hombroCalculado,
        y: talle
    };

    const Ip = {
        x: medioAncho,
        y: talle - bajadaHombro
    };

    const Gp = {
        x: 0,
        y: talle - bajadaCuello
    };

    const Jp = {
        x: medioAncho,
        y: Ip.y - sisa
    };


    // L: 2 cm por encima de J

    const Lp = {
        x: Jp.x,
        y: Jp.y + 2
    };


    const Kp = {
        x: cuartoPecho,
        y: Jp.y
    };


    const Mp = {
        x: Kp.x + sisaHorizontal,
        y: Jp.y
    };


    const Np = {
        x: Cp.x + talleHorizontal,
        y: 0
    };


    const Op = {
        x: 0,
        y: -bajadaTalle
    };


    // ==========================
    // LIENZO
    // ==========================

    const minX = 0;
    const maxX = Np.x;

    const minY = Op.y;
    const maxY = Ap.y;

    const margenIzq = 20;
    const margenSup = 20;
    const margenDer = 20;
    const margenInf = 20;


    function xSvg(xCm) {

        return margenIzq +
            mm(xCm - minX);
    }


    function ySvg(yCm) {

        return margenSup +
            mm(maxY - yCm);
    }


    // ==========================
    // PUNTOS SVG
    // ==========================

    const D = {
        x: xSvg(Dp.x),
        y: ySvg(Dp.y)
    };

    const A = {
        x: xSvg(Ap.x),
        y: ySvg(Ap.y)
    };

    const B = {
        x: xSvg(Bp.x),
        y: ySvg(Bp.y)
    };

    const C = {
        x: xSvg(Cp.x),
        y: ySvg(Cp.y)
    };

    const E = {
        x: xSvg(Ep.x),
        y: ySvg(Ep.y)
    };

    const F = {
        x: xSvg(Fp.x),
        y: ySvg(Fp.y)
    };

    const H = {
        x: xSvg(Hp.x),
        y: ySvg(Hp.y)
    };

    const I = {
        x: xSvg(Ip.x),
        y: ySvg(Ip.y)
    };

    const G = {
        x: xSvg(Gp.x),
        y: ySvg(Gp.y)
    };

    const J = {
        x: xSvg(Jp.x),
        y: ySvg(Jp.y)
    };

    const L = {
        x: xSvg(Lp.x),
        y: ySvg(Lp.y)
    };

    const K = {
        x: xSvg(Kp.x),
        y: ySvg(Kp.y)
    };

    const M = {
        x: xSvg(Mp.x),
        y: ySvg(Mp.y)
    };

    const N = {
        x: xSvg(Np.x),
        y: ySvg(Np.y)
    };

    const O = {
        x: xSvg(Op.x),
        y: ySvg(Op.y)
    };


    // ==========================
    // TAMAÑO SVG
    // ==========================

    const anchoSVG =
        mm(maxX - minX) +
        margenIzq +
        margenDer;

    const altoSVG =
        mm(maxY - minY) +
        margenSup +
        margenInf;


    const svg =
        document.getElementById("patron");


    svg.setAttribute(
        "width",
        anchoSVG + "mm"
    );

    svg.setAttribute(
        "height",
        altoSVG + "mm"
    );

    svg.setAttribute(
        "viewBox",
        `0 0 ${anchoSVG} ${altoSVG}`
    );


    // ==========================
    // CUELLO H-G
    // ==========================

    const dxCuello =
        H.x - G.x;


    const centroCuelloY =
        (H.y + G.y) / 2 -
        (dxCuello * dxCuello) /
        (2 * (H.y - G.y));


    const radioCuello =
        Math.sqrt(
            Math.pow(H.x - G.x, 2) +
            Math.pow(
                H.y - centroCuelloY,
                2
            )
        );


    // ==========================
    // SISA I-L
    //
    // AUXILIAR A 2 CM
    // ==========================

    const auxiliarX =
        xSvg(Ep.x - 2);


    const alturaIL =
        L.y - I.y;


    const salidaControles =
        mm(2) / 0.75;


    const control1 = {

        x:
            I.x -
            salidaControles,

        y:
            I.y +
            alturaIL * 0.24
    };


    const control2 = {

        x:
            L.x -
            salidaControles,

        y:
            L.y -
            alturaIL * 0.15
    };


    // ==========================
    // ARCO L-K
    //
    // CIRCUNFERENCIA REAL
    //
    // Centro sobre la vertical de L.
    // ==========================

    const dxLK =
        K.x - L.x;

    const dyLK =
        K.y - L.y;


    const radioLK =
        (
            dxLK * dxLK +
            dyLK * dyLK
        ) /
        (2 * dyLK);


    // ==========================
    // K-M
    // ==========================

    const controlKM1 = {

        x:
            K.x +
            mm(0.8),

        y:
            K.y
    };


    const controlKM2 = {

        x:
            M.x -
            mm(0.4),

        y:
            M.y
    };


    // ==========================
    // ARCO N-O
    //
    // CIRCUNFERENCIA REAL
    //
    // Centro sobre la vertical de O.
    // ==========================

    const dxNO =
        O.x - N.x;

    const dyNO =
        O.y - N.y;


    const radioNO =
        (
            dxNO * dxNO +
            dyNO * dyNO
        ) /
        (2 * dyNO);


    // ==========================
    // DIBUJO
    // ==========================

    svg.innerHTML = `


        <!-- D-A-B-C -->

        <path
            class="linea"
            d="
                M ${D.x} ${D.y}
                L ${A.x} ${A.y}
                L ${B.x} ${B.y}
                L ${C.x} ${C.y}
            "
        />


        <!-- D-N -->

        <path
            class="linea"
            d="
                M ${D.x} ${D.y}
                L ${N.x} ${N.y}
            "
        />


        <!-- E-F -->

        <path
            class="linea"
            d="
                M ${E.x} ${E.y}
                L ${F.x} ${F.y}
            "
        />


        <!-- H-I -->

        <path
            class="linea"
            d="
                M ${H.x} ${H.y}
                L ${I.x} ${I.y}
            "
        />


        <!-- CUELLO H-G -->

        <path
            class="curva"
            d="
                M ${H.x} ${H.y}

                A
                    ${radioCuello}
                    ${radioCuello}
                    0 0 1
                    ${G.x}
                    ${G.y}
            "
        />


        <!-- AUXILIAR SISA -->

        <path
            class="auxiliar"
            d="
                M ${auxiliarX} ${I.y}
                L ${auxiliarX} ${L.y}
            "
        />


        <!-- SISA I-L -->

        <path
            class="curva"
            d="
                M ${I.x} ${I.y}

                C
                    ${control1.x}
                    ${control1.y},

                    ${control2.x}
                    ${control2.y},

                    ${L.x}
                    ${L.y}
            "
        />


        <!-- ARCO CIRCULAR L-K -->

        <path
            class="curva"
            d="
                M ${L.x} ${L.y}

                A
                    ${radioLK}
                    ${radioLK}
                    0
                    0
                    0
                    ${K.x}
                    ${K.y}
            "
        />


        <!-- K-M -->

        <path
            class="curva"
            d="
                M ${K.x} ${K.y}

                C
                    ${controlKM1.x}
                    ${controlKM1.y},

                    ${controlKM2.x}
                    ${controlKM2.y},

                    ${M.x}
                    ${M.y}
            "
        />


        <!-- M-N -->

        <path
            class="linea"
            d="
                M ${M.x} ${M.y}
                L ${N.x} ${N.y}
            "
        />


        <!-- ARCO CIRCULAR N-O -->

        <path
            class="curva"
            d="
                M ${N.x} ${N.y}

                A
                    ${radioNO}
                    ${radioNO}
                    0
                    0
                    1
                    ${O.x}
                    ${O.y}
            "
        />


        <!-- O-D -->

        <path
            class="linea"
            d="
                M ${O.x} ${O.y}
                L ${D.x} ${D.y}
            "
        />


        <!-- PUNTOS -->

        <circle class="punto"
            cx="${D.x}" cy="${D.y}" r="1.5"/>

        <circle class="punto"
            cx="${A.x}" cy="${A.y}" r="1.5"/>

        <circle class="punto"
            cx="${B.x}" cy="${B.y}" r="1.5"/>

        <circle class="punto"
            cx="${C.x}" cy="${C.y}" r="1.5"/>

        <circle class="punto"
            cx="${E.x}" cy="${E.y}" r="1.5"/>

        <circle class="punto"
            cx="${F.x}" cy="${F.y}" r="1.5"/>

        <circle class="punto"
            cx="${H.x}" cy="${H.y}" r="1.5"/>

        <circle class="punto"
            cx="${I.x}" cy="${I.y}" r="1.5"/>

        <circle class="punto"
            cx="${G.x}" cy="${G.y}" r="1.5"/>

        <circle class="punto"
            cx="${J.x}" cy="${J.y}" r="1.5"/>

        <circle class="punto"
            cx="${L.x}" cy="${L.y}" r="1.5"/>

        <circle class="punto"
            cx="${K.x}" cy="${K.y}" r="1.5"/>

        <circle class="punto"
            cx="${M.x}" cy="${M.y}" r="1.5"/>

        <circle class="punto"
            cx="${N.x}" cy="${N.y}" r="1.5"/>

        <circle class="punto"
            cx="${O.x}" cy="${O.y}" r="1.5"/>


        <!-- LETRAS -->

        <text class="texto"
            x="${D.x - 8}"
            y="${D.y + 5}">D</text>

        <text class="texto"
            x="${A.x - 8}"
            y="${A.y - 3}">A</text>

        <text class="texto"
            x="${B.x + 3}"
            y="${B.y - 3}">B</text>

        <text class="texto"
            x="${C.x + 3}"
            y="${C.y + 5}">C</text>

        <text class="texto"
            x="${E.x + 3}"
            y="${E.y - 3}">E</text>

        <text class="texto"
            x="${F.x + 3}"
            y="${F.y + 5}">F</text>

        <text class="texto"
            x="${H.x + 3}"
            y="${H.y - 3}">H</text>

        <text class="texto"
            x="${I.x + 3}"
            y="${I.y - 3}">I</text>

        <text class="texto"
            x="${G.x - 8}"
            y="${G.y - 3}">G</text>

        <text class="texto"
            x="${J.x + 3}"
            y="${J.y + 5}">J</text>

        <text class="texto"
            x="${L.x + 3}"
            y="${L.y - 3}">L</text>

        <text class="texto"
            x="${K.x + 3}"
            y="${K.y - 3}">K</text>

        <text class="texto"
            x="${M.x + 3}"
            y="${M.y - 3}">M</text>

        <text class="texto"
            x="${N.x + 3}"
            y="${N.y + 5}">N</text>

        <text class="texto"
            x="${O.x - 8}"
            y="${O.y + 5}">O</text>

    `;
}


dibujarPatron();

</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.1/dist/svg2pdf.umd.min.js">
</script>

<script src="../js/generarpdf.js"></script>


</body>
</html>
